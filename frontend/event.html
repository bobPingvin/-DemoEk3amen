<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мероприятие</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🎟️</div>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">Магазин мероприятий</a></h1>
    <a href="cart.html" class="cart-link">🛒 Корзина <span id="cart-count">0</span></a>
    <h1><img src="/uploads/picture.png" alt="logo" style="height:28px; width:28px; border-radius:4px; vertical-align:middle; margin-right:8px;"> Магазин товаров</h1>
  </header>

  <main id="event-detail">
    <p>Загрузка...</p>
  </main>

  <div id="buy-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Купить билеты</h2>
      <label>
        Покупатель:
        <select id="buyer"></select>
      </label>
      <label>
        Количество билетов:
        <input type="number" id="qty" value="1" min="1">
      </label>
      <p class="price-line">Итого: <b id="total-price">0</b> ₽</p>
      <div class="actions">
        <button id="cancel-buy">Отмена</button>
        <button id="confirm-buy">Оформить</button>
      </div>
    </div>
  </div>

  <script src="cart.js"></script>
  <script src="event.js"></script>
</body>
</html>
