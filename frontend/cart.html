<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Корзина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🎟️</div>
    <h1><a href="index.html" style="color:inherit;text-decoration:none">Магазин мероприятий</a></h1>
    <h1><img src="/uploads/picture.png" alt="logo" style="height:28px; width:28px; border-radius:4px; vertical-align:middle; margin-right:8px;"> Магазин товаров</h1>
  </header>

  <main>
    <h2>Корзина</h2>
    <div id="cart-items"></div>
    <p class="total">Итого: <b id="cart-total">0</b> ₽</p>
  </main>

  <script src="cart.js"></script>
  <script>
    function render() {
      const items = Cart.read();
      const box = document.getElementById('cart-items');
      if (!items.length) { box.innerHTML = '<p>Корзина пуста</p>'; return; }
      box.innerHTML = items.map(i => `
        <div class="cart-row">
          <span>${i.title}</span>
          <span>${i.quantity} × ${i.price} ₽</span>
          <button onclick="removeItem(${i.event_id})">Удалить</button>
        </div>
      `).join('');
      document.getElementById('cart-total').textContent =
        items.reduce((s, i) => s + i.quantity * i.price, 0);
    }
    function removeItem(id) { Cart.remove(id); render(); }
    render();
  </script>
</body>
</html>
